services:
  # Frontend - Static Site
  - type: web
    name: monomath
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

  # Backend - Web Service
  - type: web
    name: monomath-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cd backend && npx prisma generate && npm run build
    # Migrations are deliberately NOT run here. startCommand executes on every
    # container start — restarts, health-check failures, free-tier spin-ups —
    # and each run competes for Prisma's advisory lock. Through Neon's pooler
    # that lock can be orphaned on a reused backend, at which point the service
    # crash-loops and every retry makes it worse.
    # Apply migrations deliberately instead: `npm run db:deploy` in backend/.
    startCommand: cd backend && npx tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # The token is the player's identity — a short expiry would reset
      # everyone's BKT mastery when it lapsed.
      - key: JWT_EXPIRES_IN
        value: 90d
      - key: CORS_ORIGIN
        sync: false
      # Neon pooled connection (host contains "-pooler"), used at runtime.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection (no "-pooler"), used by `prisma migrate deploy`.
      # PgBouncer cannot run migrations, so this must be set separately.
      - key: DIRECT_URL
        sync: false
